
name: Post-deployment smoke test

on:
  workflow_run:
    workflows: ["Publish container image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    name: Check Docker-backed Render service
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wait for application health
        env:
          BASE_URL: ${{ secrets.RENDER_IMAGE_SERVICE_BASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_URL:-}" ]; then
            echo "Missing RENDER_IMAGE_SERVICE_BASE_URL secret"
            exit 1
          fi

          for attempt in $(seq 1 24); do
            echo "Health check attempt $attempt of 24"

            if response=$(curl \
              --fail \
              --silent \
              --show-error \
              --max-time 10 \
              "$BASE_URL/api/health" 2>/dev/null); then

              if echo "$response" | jq -e \
                '.status == "ok"' >/dev/null; then
                echo "Smoke test passed: $response"
                exit 0
              fi
            fi

            if [ "$attempt" -lt 24 ]; then
              sleep 5
            fi
          done

          echo "Smoke test failed: application did not become healthy"
          exit 1
